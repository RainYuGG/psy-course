name: Update Continuing Education Courses & Deploy Pages

on:
  push:
    branches:
      - master
      - main
    paths:
      - "docs/**"
      - ".github/workflows/update-courses.yml"
  schedule:
    # Runs daily at 22:00 UTC (06:00 Taiwan time UTC+8)
    - cron: "0 22 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages-and-course-data"
  cancel-in-progress: false

jobs:
  scrape-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        if: github.event_name != 'push'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        if: github.event_name != 'push'
        run: pip install -r requirements.txt

      - name: Run course scraper pipeline
        if: github.event_name != 'push'
        run: python -m scraper.cli --output-dir docs/data

      - name: Commit and push updated course data if changed
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/courses.csv docs/data/courses.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(data): update continuing education courses"
            git push
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "docs"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
